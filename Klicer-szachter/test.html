<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        #lift{

            background-image: url(lift1.png);

            width: 500px;

            height: 500px;

            animation: open 2s infinite;

            float: left;

        }

        @keyframes open {

            0%{
                background-image: url(lift1.png);
            }

            20%{
                background-image: url(lift2.png);
            }

            40%{
                background-image: url(lift3.png);
            }

            60%{
                background-image: url(lift3.png);
            }

            80%{
                background-image: url(lift2.png);
            }

            100%{
                background-image: url(lift1.png);
            }
            
        }

    </style>

</head>
<body>
    
    <div id="lift"></div>

</body>
</html>
